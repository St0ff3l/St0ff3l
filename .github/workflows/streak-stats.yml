name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate light streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=default&hide_border=true&disable_animations=true
          path: profile/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=transparent&hide_border=true&stroke=30363d&ring=58a6ff&fire=f0883e&currStreakLabel=e6edf3&sideLabels=8b949e&currStreakNum=f0f6fc&dates=8b949e&sideNums=f0f6fc&disable_animations=true
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub stats cards
        env:
          STATS_USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          stats_tmp_dir="$(mktemp -d)"
          stats_light_url="https://github-stats-extended.vercel.app/api?username=${STATS_USERNAME}&show_icons=true&theme=default&hide_border=true"
          stats_dark_url="https://github-stats-extended.vercel.app/api?username=${STATS_USERNAME}&show_icons=true&theme=transparent&hide_border=true&bg_color=00000000&title_color=58a6ff&text_color=e6edf3&icon_color=58a6ff&border_color=30363d"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 30 "$stats_light_url" -o "$stats_tmp_dir/stats-light.svg"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 30 "$stats_dark_url" -o "$stats_tmp_dir/stats-dark.svg"

          for stats_file in "$stats_tmp_dir/stats-light.svg" "$stats_tmp_dir/stats-dark.svg"; do
            grep -q '<svg' "$stats_file"
            if grep -Eiq 'Something went wrong|Maximum retries exceeded|PAT_1|Resource not accessible' "$stats_file"; then
              echo "Stats provider returned an error card: $stats_file"
              exit 1
            fi
          done

          mv "$stats_tmp_dir/stats-light.svg" profile/stats-light.svg
          mv "$stats_tmp_dir/stats-dark.svg" profile/stats-dark.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update streak stats"
          git push
